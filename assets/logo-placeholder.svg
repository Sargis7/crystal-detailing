<?xml version="1.0" encoding="UTF-8"?>
<!--
  Crystal Detailing — знак бренда (заглушка).

  НАЗНАЧЕНИЕ
  Временный логотип для шапки сайта. Показывается в <img class="brand__mark">,
  ширина и высота отображения — 40×40 px. Реальную версию заказчик положит
  в assets/ и пропишет путь в js/config.js (ключ brand.logo).

  ПОЧЕМУ БЕЗ ФОНА
  В шапке за знаком нет подложки: он лежит прямо на тёмном графите (#0A0A0C).
  Поэтому фон у файла прозрачный, а сам камень нарисован светлым золотом —
  тёмная плита внутри знака сделала бы его невидимым. Прозрачность нужна и
  потому, что data-config-src="brand.logo" допускает подмену файла с другими
  пропорциями: подложка-прямоугольник выдала бы чужие границы.

  КАК ЧИТАЕТСЯ В 40×40
  Восемь граней вместо двадцати: на 40 пикселях мелкие фасеты сливаются.
  Яркость граней разведена по кругу (свет сверху-слева), поэтому форма
  держится даже в миниатюре. Никаких фильтров, масок и внешних шрифтов —
  файл обязан одинаково рендериться из file://, из crawler и из браузера.

  ПОЧЕМУ ГРАНИ РИСУЮТСЯ, А НЕ ВЫРЕЗАЮТСЯ
  Восемь плоских треугольников покрывают площадку рундиста ровно один раз,
  без наложений. Это принципиально: при заливке nonzero (умолчание SVG)
  любые перекрытия «складываются» по правилу чётности и дают дыры —
  на 40×40 они читаются как сломанный логотип, а не как огранка.
  Поэтому здесь нет ни одной фигуры «поверх» другой, кроме тонких обводок.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Crystal Detailing">
  <title>Crystal Detailing</title>

  <defs>
    <!-- Основной объём камня: светлое золото сверху-слева, глубокое снизу-справа. -->
    <linearGradient id="crx-body" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#F6E7AC"/>
      <stop offset="34%" stop-color="#E3C565"/>
      <stop offset="68%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8A6D12"/>
    </linearGradient>

    <!-- Блик на верхней площадке: «полировка» камня. -->
    <linearGradient id="crx-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8DE"/>
      <stop offset="100%" stop-color="#E3C565"/>
    </linearGradient>

    <!-- Нижние грани уходят в тень — так камень «стоит», а не «висит». -->
    <linearGradient id="crx-shade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#7A5F0F"/>
    </linearGradient>
  </defs>

  <!-- ВНУТРЕННИЕ РЁБРА — их приходится рисовать ДО верхней площадки.
       Рёбра рундиста лежат на границе площадки и павильона; если положить
       их поверх, они разрезают светлую верхнюю площадку пополам и знак
       читается как расчерченный. Все обводки — fill: none, правило заливки
       на них не действует. -->
  <path d="M4 23 H60 M22.5 20.7 L32 33 M41.5 20.7 L32 33 M32 33 L32 60
           M32 60 L22 41 M32 60 L48 34.4"
        fill="none" stroke="#3A2E06" stroke-width="1" stroke-opacity="0.42"
        stroke-linejoin="round"/>

  <!-- Пять граней верхней площадки: сторона и пять треугольников.
       Площадка рисуется ПОСЛЕ рёбер, поэтому перекрывает их линию рундиста
       и остаётся светлым, незамутнённым бликом. -->
  <path d="M19 7 H45 L60 23 L32 19 L4 23 Z"      fill="url(#crx-top)"/>
  <path d="M19 7 H45 L32 19 Z"                   fill="#F2E2A4"/>
  <path d="M45 7 L60 23 L41.5 20.7 L32 19 Z"     fill="#D9B94A"/>
  <path d="M19 7 L32 19 L22.5 20.7 L4 23 Z"      fill="#EBD584"/>
  <path d="M4 23 L22.5 20.7 L32 33 Z"            fill="#C9A227"/>
  <path d="M22.5 20.7 L41.5 20.7 L32 33 Z"       fill="#B08D1E"/>

  <!-- Правая полусфера и павильон: тоже без наложений. -->
  <path d="M60 23 L41.5 20.7 L32 33 L48 34.4 Z"  fill="#A5851B"/>
  <path d="M41.5 20.7 L32 33 L48 34.4 Z"         fill="#9C7C18"/>
  <path d="M4 23 L32 33 L32 60 Z"                fill="url(#crx-shade)"/>
  <path d="M4 23 L32 60 L22 41 Z"                fill="#6E5510"/>
  <path d="M60 23 L48 34.4 L32 60 Z"             fill="#B08D1E"/>
  <path d="M60 23 L32 60 L48 34.4 Z"             fill="#8A6D12"/>

  <!-- Ребро «стола» поверх павильона: граница между площадкой и низом. -->
  <path d="M4 23 H60" fill="none" stroke="#3A2E06" stroke-width="1"
        stroke-opacity="0.42"/>

  <!-- Внешний контур рундиста — последним слоем, чтобы ни одна грань
       его не перекрыла. Тонкая светлая линия отделяет камень от тёмного
       фона шапки, где контраста «золото на графите» мало. -->
  <path d="M19 7 H45 L60 23 L32 60 L4 23 Z"
        fill="none" stroke="#FFF3C4" stroke-width="1.6" stroke-linejoin="round"
        stroke-opacity="0.75"/>
</svg>
