<?xml version="1.0" encoding="UTF-8"?>
<!--
  Заглушка галереи, работа 3 из 6.

  ЗАЧЕМ ЭТОТ ФАЙЛ
  Реальных снимков работ пока нет: заказчик возьмёт их из своей карточки
  на Яндекс.Картах. Галерея из шести битых картинок выглядит как сломанный
  сайт, поэтому каждая плитка получает аккуратную заглушку с номером
  и подписью «Здесь будет работа №3». Заглушки не подменяют собой
  фотографии: они честно сообщают, что место свободно.

  КАК ЗАМЕНИТЬ
  Положите в эту папку файл photo-3.jpg. js/gallery.js подставит его
  в плитку сам, и эта заглушка перестанет показываться. Полный список
  требований — в README.md рядом.

  ПОЧЕМУ ВСЁ СОБРАНО К ЦЕНТРУ
  Плитка показывает картинку через object-fit: cover, то есть обрезает
  края. На мобильном плитка почти квадратная, и от кадра 4:3 остаются
  только центральные 80% по ширине: всё, что лежит у краёв, будет срезано.
  Поэтому холст здесь 1600x1080 (3:2), а номер и подписи ужаты в центр —
  так проверено рендером в плитку 240x230. Смысловые элементы не должны
  зависеть от того, какой ширины экран у посетителя.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080"
     preserveAspectRatio="xMidYMid slice" role="img"
     aria-label="Заглушка: работа 3, реальное фото будет добавлено">
  <title>Работа 3 — место для фотографии</title>

  <defs>
    <!-- Тема плитки 3: тёмная вишня. -->
    <linearGradient id="ph3-plate" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#1E1A22"/>
      <stop offset="48%" stop-color="#33283A"/>
      <stop offset="100%" stop-color="#553C4E"/>
    </linearGradient>

    <!-- Диагональная «ткань»: даёт плоскости объём. -->
    <pattern id="ph3-weave" width="18" height="18" patternUnits="userSpaceOnUse"
             patternTransform="rotate(25)">
      <rect width="18" height="18" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="18" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <!-- Световое пятно. Держим его в центральной зоне: у краёв оно
         всё равно срезается обрезкой cover. -->
    <radialGradient id="ph3-light" cx="72%" cy="16%" r="46%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <rect width="1600" height="1080" fill="url(#ph3-plate)"/>
  <rect width="1600" height="1080" fill="url(#ph3-weave)"/>
  <rect width="1600" height="1080" fill="url(#ph3-light)"/>

  <!-- Пунктирная рамка: «окно» под будущий снимок. Отступ 160 = ровно та
       зона, которая переживает обрезку cover на мобильном. -->
  <rect x="160" y="90" width="1280" height="800" rx="26"
        fill="none" stroke="#C9A227" stroke-opacity="0.3" stroke-width="3"
        stroke-dasharray="24 18"/>

  <!-- Пиктограмма кадра. Собрана из простых фигур вместо внешнего шрифта
       или иконки: файл обязан работать из file:// без сети. -->
  <g transform="translate(800 400)">
    <rect x="-110" y="-80" width="220" height="164" rx="20"
          fill="none" stroke="#E3C565" stroke-opacity="0.9" stroke-width="9"/>
    <rect x="-48" y="-108" width="96" height="38" rx="11"
          fill="none" stroke="#E3C565" stroke-opacity="0.9" stroke-width="9"/>
    <circle cx="0" cy="4" r="46"
            fill="none" stroke="#E3C565" stroke-opacity="0.9" stroke-width="9"/>
    <circle cx="70" cy="-52" r="9" fill="#E3C565" fill-opacity="0.9"/>
  </g>



</svg>
