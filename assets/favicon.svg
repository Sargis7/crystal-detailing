<?xml version="1.0" encoding="UTF-8"?>
<!--
  Crystal Detailing — фавикон.

  ЧТО ВНУТРИ
  Силуэт машины из логотипа бренда (тот же, что в шапке), но
  повёрнутый смысл: в 16 px горизонтальная линия толщиной в пиксель
  исчезает, поэтому здесь силуэт обведён по контуру контрастным белым
  и поставлен на графитовую плиту. Так иконка читается как «машина»,
  а не как размытая полоска.

  ЦВЕТА
  Синий #0074BA и белый — ровно те, что в логотипе. Плита #0B0B0B
  из палитры сайта (--c-bg-alt), чтобы на светлом фоне рабочего стола
  иконка не растворялась.

  ПОЧЕМУ КОНТУР, А НЕ ЗАЛИВКА
  В логотипе машина нарисована тонкой линией. Если её залить в фавиконе,
  получится чужой по форме знак. Контур сохранён: та же геометрия,
  просто утолщённая до 3 px в системе координат 64×64.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Crystal Detailing">
  <title>Crystal Detailing</title>

  <!-- Плита под иконку домашнего экрана: iOS дорисует свою, если своей нет. -->
  <rect width="64" height="64" rx="14" ry="14" fill="#0B0B0B"/>

  <!-- Машина: крыша сзади справа, капот влево, два колеса. Толщина 2.6 px
       в координатах 64 — на 16 px это ~0.65 px, ниже глаз не различает
       линии между собой, поэтому центральная часть силуэта упрощена. -->
  <g fill="none" stroke="#0074BA" stroke-width="2.6" stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M8 40 L14 34 Q20 30 28 28 L38 21 Q42 19 47 20 L55 23 Q58 24 58 27 L58 33"/>
    <path d="M8 40 L8 36 Q8 33 11 33 L58 33"/>
    <circle cx="20" cy="41" r="5"/>
    <circle cx="46" cy="41" r="5"/>
  </g>

  <!-- Светлая кромка по контуру: отделяет синее от плиты на тёмном фоне. -->
  <rect x="0.8" y="0.8" width="62.4" height="62.4" rx="13.4" ry="13.4"
        fill="none" stroke="#F5F5F5" stroke-opacity="0.16" stroke-width="1.6"/>
</svg>
