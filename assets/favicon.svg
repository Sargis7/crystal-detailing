<?xml version="1.0" encoding="UTF-8"?>
<!--
  Crystal Detailing — фавикон (заглушка).

  ПОЧЕМУ НЕ ТОТ ЖЕ КАМЕНЬ
  Файл подключён дважды: как rel="icon" (16×16 во вкладке) и как
  rel="apple-touch-icon" (иконка на домашнем экране). В 16×16 восемь граней
  превращаются в мутное пятно, поэтому здесь оставлена только ПОРТРЕТНАЯ
  форма камня: рундист плюс клин низа, крупными полями. Силуэт читается
  как «кристалл», а не как случайная фигура.

  ПОЧЕМУ ЕСТЬ ФОН
  Apple перерисовывает иконку домашнего экрана в скруглённый квадрат и
  дорисовывает чёрную подложку, если своей нет: золото на чёрном смотрится
  как чужой значок. Графит #0A0A0C из палитры сайта решает это и заодно
  даёт одинаковый вид обеим ролям файла.

  ПОЧЕМУ ЛИТЕРА «C», А НЕ ВНЕШНИЙ ШРИФТ
  Текст в SVG зависит от шрифта, а шрифт — это либо системный стек (тогда
  вид непредсказуем), либо внешний файл (тогда ломается офлайн-просмотр).
  Поэтому в файле нет ни одной буквы: только простые фигуры.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Crystal">
  <title>Crystal</title>

  <defs>
    <linearGradient id="fav-mark" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#F6E7AC"/>
      <stop offset="40%" stop-color="#E3C565"/>
      <stop offset="100%" stop-color="#A5851B"/>
    </linearGradient>
  </defs>

  <!-- Подложка: графит палитры, скруглённый по макету iOS. -->
  <rect width="64" height="64" rx="14" ry="14" fill="#0A0A0C"/>

  <!-- Один плоский силуэт кристалла: широкая площадка сверху и клин вниз.
       Промежуточные рёбра при 16 px только шумят. -->
  <path d="M20 14 H44 L54 27 L32 52 L10 27 Z" fill="url(#fav-mark)"/>

  <!-- Единственная внутренняя линия: держит «огранку» и в миниатюре,
       и на 180 px домашнего экрана. Тёмная — читается как выемка. -->
  <path d="M20 14 L32 24 L44 14 M10 27 H54 L32 52 L32 24"
        fill="none" stroke="#0A0A0C" stroke-width="2.4" stroke-linejoin="round"
        stroke-opacity="0.55"/>

  <!-- Светлая кромка по контуру: отделяет камень от подложки, чтобы
       на тёмном фоне рабочего стола иконка не темнела в пятно. -->
  <path d="M20 14 H44 L54 27 L32 52 L10 27 Z"
        fill="none" stroke="#FFF3C4" stroke-width="1.4" stroke-linejoin="round"
        stroke-opacity="0.35"/>
</svg>
